name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: Wawona WASI / Wayland
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - name: Check formatting and lints
        run: |
          cargo fmt --manifest-path wasm/Cargo.toml --check
          cargo clippy --manifest-path wasm/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path wasm/Cargo.toml --locked --target wasm32-wasip1 -- -D warnings
      - name: Test shared rules, engine and wasm board input
        run: cargo test --manifest-path wasm/Cargo.toml --locked
      - name: Install integration test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scripts/wasm-requirements.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y weston
      - name: Build the WASI module and Wawona package
        run: ./scripts/build-wasm.sh
      - name: Execute wasm input and protocol checks
        run: .venv/bin/python scripts/wasm_check.py
      - name: Commit a real Wayland SHM buffer to Weston
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/chess-wayland"
          export WAYLAND_DISPLAY=wayland-chess-ci
          install -d -m700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            --log=artifacts/weston.log &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" || { cat artifacts/weston.log; exit 1; }
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          timeout 30 .venv/bin/python scripts/wasm_check.py --wayland
      - uses: actions/upload-artifact@v4
        with:
          name: chess-wawona-wasm
          path: artifacts/wasm/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-verification
          path: |
            artifacts/wasm-*.png
            artifacts/weston.log

  linux:
    name: Native Linux / Kirigami / Vulkan
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      QT_QPA_PLATFORM: xcb
    steps:
      - name: Install build and headless desktop dependencies
        run: |
          pacman -Syu --needed --noconfirm git curl pkgconf qt6-base qt6-declarative \
            kirigami qqc2-desktop-style vulkan-icd-loader vulkan-swrast \
            xorg-server-xvfb xorg-xauth python ffmpeg
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-linux
      - name: Formatting, lint, tests, Vulkan and GUI integration
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/chess-runtime"
          install -d -m700 "$XDG_RUNTIME_DIR"
          CHESS_GUI_CHECK=1 xvfb-run -a -s '-screen 0 1280x1024x24' ./scripts/check.sh
      - name: Build release application
        run: cargo build --release --locked
      - name: Stage native package
        run: |
          PREFIX="$GITHUB_WORKSPACE/artifacts/linux" ./scripts/install.sh
          tar -C artifacts/linux -czf artifacts/chess-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: chess-linux-x86_64
          path: artifacts/chess-linux-x86_64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verification
          path: |
            artifacts/*.log
            artifacts/*.png
            artifacts/*.mp4

  release:
    name: Publish tagged build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [wasm, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: chess-wawona-wasm
          path: artifacts/wasm
      - uses: actions/download-artifact@v4
        with:
          name: chess-linux-x86_64
          path: artifacts/release
      - name: Validate version and archive catalog submission
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          row = json.loads(pathlib.Path('artifacts/wasm/index.json').read_text())['packages'][0]
          assert os.environ['RELEASE_TAG'] == 'v' + row['version'], 'Tag must match wasm/Cargo.toml version'
          PY
          cd artifacts/wasm
          sha256sum --check SHA256SUMS
          tar -czf ../release/chess-wawona-wasm.tar.gz .
          cd ../release
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish validated release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --generate-notes
