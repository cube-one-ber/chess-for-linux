[package]
name = "chess-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Native Linux chess with a Rust game engine and Vulkan rendering"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
wgpu = { version = "27", default-features = false, features = ["std", "vulkan", "wgsl"] }
shakmaty = { version = "0.30.1", features = ["variant"] }
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
lto = "thin"
strip = true
