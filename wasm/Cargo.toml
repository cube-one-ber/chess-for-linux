[package]
name = "chess-wawona"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Chess WASI Preview 1 Wayland client for Wawona Runtime"

# Separate from the Linux application's Qt/Vulkan dependencies and build.rs.
[workspace]

[dependencies]
shakmaty = { version = "0.30.1", features = ["variant"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
